name: Instaladores

# Se ejecuta al subir una etiqueta v* (por ejemplo v1.0.0-alpha.1) o a mano desde la pestaña Actions.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      macos:
        description: 'Construir también para macOS (consume más minutos)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: node scripts/preparar-recursos.mjs
      - run: npm run tipos
      - run: npm test

  construir:
    needs: pruebas
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.macos) && '["windows-latest","ubuntu-latest","macos-latest"]' || '["windows-latest","ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      # Cada sistema necesita su propio Java mínimo: por eso cada instalador se construye en su sistema.
      - run: node scripts/preparar-recursos.mjs
      - run: npm run build
      - name: Instaladores
        shell: bash
        env:
          # Firma opcional: si los secretos no existen, se construye sin firmar.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CSC_LINK" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; unset CSC_LINK CSC_KEY_PASSWORD; fi
          npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-${{ matrix.os }}
          path: |
            instaladores/*.exe
            instaladores/*.dmg
            instaladores/*.AppImage
            instaladores/*.deb
          if-no-files-found: error

  publicar:
    needs: construir
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: descargas, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: descargas/*
          body: |
            Instaladores de Obi Studio EPUB ${{ github.ref_name }}.
            - **Windows:** Obi-Studio-EPUB-…-Windows.exe (sin firmar: SmartScreen mostrará un aviso; pulsa «Más información» → «Ejecutar de todas formas»).
            - **Linux:** .AppImage (dale permiso de ejecución) o .deb.
